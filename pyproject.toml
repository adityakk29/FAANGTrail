[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faangtrail"
version = "0.1.0"
description = "A local-first programming practice app for the FAANGTrail roadmap"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "FAANGTrail contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
faangtrail = "faangtrail.cli:main"
faangtrail-gui = "faangtrail.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faangtrail = ["data/*.json", "data/problems/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]