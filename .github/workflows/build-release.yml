name: Build and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            artifact: FAANGTrail-windows-x64.exe
          - name: macos
            os: macos-latest
            artifact: FAANGTrail-macos.zip
          - name: linux
            os: ubuntu-latest
            artifact: FAANGTrail-linux-x64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build_windows.ps1
          Move-Item dist/FAANGTrail.exe dist/${{ matrix.artifact }}

      - name: Build macOS archive
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh
          mv dist/FAANGTrail-macos.zip dist/${{ matrix.artifact }}

      - name: Build Linux archive
        if: runner.os == 'Linux'
        run: |
          python -m PyInstaller --onefile --windowed --name FAANGTrail --paths src \
            --add-data "src/faangtrail/data:faangtrail/data" --clean faangtrail_entry.py
          tar -czf "dist/${{ matrix.artifact }}" -C dist FAANGTrail

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true